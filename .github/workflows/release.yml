name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag whose draft release should be resumed
        required: true
        type: string
      release_sha:
        description: Expected source SHA (optional for recovery; the tag remains authoritative)
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        required: true
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: -tags=nodynamic

jobs:
  quality:
    name: Frontend and Go checks
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      published: ${{ steps.source.outputs.published }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || github.sha }}
          fetch-depth: 0
      - name: Load release automation from the workflow revision
        env:
          AUTOMATION_SHA: ${{ github.workflow_sha }}
        run: |
          test -n "$AUTOMATION_SHA"
          mkdir -p "$RUNNER_TEMP/picpiper-release"
          git show "$AUTOMATION_SHA:scripts/release.mjs" > "$RUNNER_TEMP/picpiper-release/release.mjs"
          git show "$AUTOMATION_SHA:scripts/release-checks.mjs" > "$RUNNER_TEMP/picpiper-release/release-checks.mjs"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node "$RUNNER_TEMP/picpiper-release/release.mjs" metadata
          if [ -n "$RELEASE_TAG" ]; then
            node "$RUNNER_TEMP/picpiper-release/release.mjs" source "$RELEASE_TAG" "$RELEASE_SHA"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs
      - name: Install native codec build tools
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config build-essential nasm
      - name: Verify frontend and Go
        run: |
          pnpm test
          pnpm build:web
          node --test "$RUNNER_TEMP/picpiper-release/release-checks.mjs"
          node scripts/go.mjs test ./internal/...
          node scripts/go.mjs test -race ./internal/...
          node scripts/go.mjs test -race ./internal/imaging -run '^TestModernCodecsConcurrentFirstUse$' -count=1
          CGO_ENABLED=0 node scripts/go.mjs test ./internal/...
          node scripts/go.mjs vet ./...
          test -z "$(gofmt -l *.go internal scripts/icon)"

  package:
    name: ${{ matrix.target }}
    needs: quality
    if: needs.quality.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential nasm libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb dbus-x11
      - name: Check native bridge and concurrency
        run: |
          node scripts/go.mjs test ./...
          if [ "$CGO_ENABLED" = 1 ]; then
            node scripts/go.mjs test -race ./...
          fi
      - name: Build app and installers
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.release_tag && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: pnpm build
      - name: Exercise packaged macOS app
        if: runner.os == 'macOS'
        run: pnpm smoke
      - name: Exercise packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/package-smoke.mjs
      - name: Exercise packaged Linux app
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/package-smoke.mjs
      - name: Keep desktop artifacts and smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pic-piper-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*.dmg
            build/${{ matrix.target }}/*-setup-*.exe
            build/${{ matrix.target }}/*.deb
            build/${{ matrix.target }}/*.rpm
            build/${{ matrix.target }}/*.tar.gz
            build/smoke-*/report.json
            build/smoke-*/*.png
            build/package-smoke-*/report.json
            build/package-smoke-*/*.png
            build/package-smoke-*/process.log

      - name: Verify platform release assets
        if: success() && inputs.release_tag != ''
        env:
          AUTOMATION_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.quality.outputs.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          test -n "$AUTOMATION_SHA"
          mkdir -p "$RUNNER_TEMP/picpiper-release"
          git show "$AUTOMATION_SHA:scripts/release.mjs" > "$RUNNER_TEMP/picpiper-release/release.mjs"
          node "$RUNNER_TEMP/picpiper-release/release.mjs" artifacts "$RELEASE_TAG" "$RELEASE_SHA" "$BUILD_TARGET"
      - name: Keep signed release assets
        if: success() && inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: pic-piper-release-assets-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*.dmg
            build/${{ matrix.target }}/*-setup-*.exe
            build/${{ matrix.target }}/*.deb
            build/${{ matrix.target }}/*.rpm
            build/${{ matrix.target }}/*.tar.gz
            build/${{ matrix.target }}/*.delta
            build/${{ matrix.target }}/update-*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: inputs.release_tag != '' && needs.quality.outputs.published != 'true'
    needs: [quality, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          pattern: pic-piper-release-assets-*
          merge-multiple: true
          path: build/release-assets
      - name: Publish release
        env:
          AUTOMATION_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.quality.outputs.sha }}
          RELEASE_ASSET_DIR: build/release-assets
        run: |
          test -n "$AUTOMATION_SHA"
          mkdir -p "$RUNNER_TEMP/picpiper-release"
          git show "$AUTOMATION_SHA:scripts/release.mjs" > "$RUNNER_TEMP/picpiper-release/release.mjs"
          node "$RUNNER_TEMP/picpiper-release/release.mjs" publish "$RELEASE_TAG" "$RELEASE_SHA"
