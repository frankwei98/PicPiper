name: Build MVP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave empty for checks only)
        required: false
        type: string
  pull_request:
  push:
    branches: [main, migration/mygo]
    tags: ["v*"]

permissions:
  contents: read

env:
  GOFLAGS: -tags=nodynamic

jobs:
  quality:
    name: Frontend and Go checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install native codec build tools
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config build-essential nasm
      - name: Verify frontend and Go
        run: |
          pnpm test
          pnpm build:web
          node scripts/go.mjs test ./internal/...
          node scripts/go.mjs test -race ./internal/...
          node scripts/go.mjs test -race ./internal/imaging -run '^TestModernCodecsConcurrentFirstUse$' -count=1
          CGO_ENABLED=0 node scripts/go.mjs test ./internal/...
          node scripts/go.mjs vet ./...
          test -z "$(gofmt -l main.go main_test.go smoke.go internal scripts/icon)"

  package:
    name: macOS arm64 MVP
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check native bridge and concurrency
        run: |
          node scripts/go.mjs test ./...
          node scripts/go.mjs test -race ./...
      - name: Build signed app and disk image
        run: pnpm build
      - name: Exercise packaged app
        run: pnpm smoke
      - name: Keep desktop artifacts and smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pic-piper-macos-arm64
          path: |
            build/darwin-arm64/*.dmg
            build/smoke-*/report.json
            build/smoke-*/*.png

      - name: Upload release DMG
        if: success() && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
        uses: actions/upload-artifact@v4
        with:
          name: pic-piper-release-dmg
          path: build/darwin-arm64/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pic-piper-release-dmg
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          dmg_file="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_file"
          gh release create "$RELEASE_TAG" "$dmg_file" \
            --title "Pic Piper $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
